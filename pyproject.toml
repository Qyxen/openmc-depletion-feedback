[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmc-depletion-feedback"
version = "0.1.1"
description = "Reusable OpenMC depletion simulations with optional soluble-species feedback control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openmc>=0.14"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

